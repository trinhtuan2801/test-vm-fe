name: Deploy to GCloud VMs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-VM1:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH for VM1
        env:
          SSH_KEY: ${{ secrets.VM1_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM1_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/VM1_deploy_key
          chmod 600 ~/.ssh/VM1_deploy_key

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/VM1_known_hosts
          chmod 600 ~/.ssh/VM1_known_hosts

      - name: Deploy to VM1
        env:
          HOST: ${{ secrets.VM1_HOST }}
          USER: ${{ secrets.VM1_USER }}
          BUILD_SCRIPT: ${{ secrets.VM1_BUILD_SCRIPT }}
        run: |
          raw_path="$(printf '%s' "$BUILD_SCRIPT" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          quoted_path="$(printf '%q' "$raw_path")"

          ssh -i ~/.ssh/VM1_deploy_key \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/VM1_known_hosts \
            "$USER@$HOST" \
            "bash -s -- $quoted_path" <<'REMOTE'
          set -euo pipefail

          script="$1"
          case "$script" in
            "~/"*) script="$HOME/${script#\~/}" ;;
          esac

          if [ ! -f "$script" ]; then
            echo "Build script not found on VM1." >&2
            echo "  remote user : $(whoami)" >&2
            echo "  remote home : $HOME" >&2
            echo "  script name : $(basename -- "$script")" >&2
            dir="$(dirname -- "$script")"
            if [ -d "$dir" ]; then
              echo "  parent directory exists, contents:" >&2
              ls -la -- "$dir" >&2
            else
              echo "  parent directory does not exist either" >&2
            fi
            exit 1
          fi

          bash "$script"
          REMOTE

  deploy-VM2:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH for VM2
        env:
          SSH_KEY: ${{ secrets.VM2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/VM2_deploy_key
          chmod 600 ~/.ssh/VM2_deploy_key

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/VM2_known_hosts
          chmod 600 ~/.ssh/VM2_known_hosts

      - name: Deploy to VM2
        env:
          HOST: ${{ secrets.VM2_HOST }}
          USER: ${{ secrets.VM2_USER }}
          BUILD_SCRIPT: ${{ secrets.VM2_BUILD_SCRIPT }}
        run: |
          raw_path="$(printf '%s' "$BUILD_SCRIPT" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          quoted_path="$(printf '%q' "$raw_path")"

          ssh -i ~/.ssh/VM2_deploy_key \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/VM2_known_hosts \
            "$USER@$HOST" \
            "bash -s -- $quoted_path" <<'REMOTE'
          set -euo pipefail

          script="$1"
          case "$script" in
            "~/"*) script="$HOME/${script#\~/}" ;;
          esac

          if [ ! -f "$script" ]; then
            echo "Build script not found on VM2." >&2
            echo "  remote user : $(whoami)" >&2
            echo "  remote home : $HOME" >&2
            echo "  script name : $(basename -- "$script")" >&2
            dir="$(dirname -- "$script")"
            if [ -d "$dir" ]; then
              echo "  parent directory exists, contents:" >&2
              ls -la -- "$dir" >&2
            else
              echo "  parent directory does not exist either" >&2
            fi
            exit 1
          fi

          bash "$script"
          REMOTE
