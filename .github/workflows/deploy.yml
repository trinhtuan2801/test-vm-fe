name: Deploy to GCloud VMs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-vm1:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH for VM1
        env:
          VM1_SSH_KEY: ${{ secrets.VM1_SSH_KEY }}
          VM1_KNOWN_HOSTS: ${{ secrets.VM1_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VM1_SSH_KEY" > ~/.ssh/vm1_deploy_key
          chmod 600 ~/.ssh/vm1_deploy_key

          printf '%s\n' "$VM1_KNOWN_HOSTS" > ~/.ssh/vm1_known_hosts
          chmod 600 ~/.ssh/vm1_known_hosts

      - name: Deploy to VM1
        env:
          VM1_HOST: ${{ secrets.VM1_HOST }}
          VM1_USER: ${{ secrets.VM1_USER }}
          VM1_BUILD_SCRIPT: ${{ secrets.VM1_BUILD_SCRIPT }}
        run: |
          raw_path="$(printf '%s' "$VM1_BUILD_SCRIPT" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          quoted_path="$(printf '%q' "$raw_path")"

          ssh -i ~/.ssh/vm1_deploy_key \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/vm1_known_hosts \
            "$VM1_USER@$VM1_HOST" \
            "bash -s -- $quoted_path" <<'REMOTE'
          set -euo pipefail

          script="$1"
          case "$script" in
            "~/"*) script="$HOME/${script#\~/}" ;;
          esac

          if [ ! -f "$script" ]; then
            echo "Build script not found on VM1." >&2
            echo "  remote user : $(whoami)" >&2
            echo "  remote home : $HOME" >&2
            echo "  script name : $(basename -- "$script")" >&2
            dir="$(dirname -- "$script")"
            if [ -d "$dir" ]; then
              echo "  parent directory exists, contents:" >&2
              ls -la -- "$dir" >&2
            else
              echo "  parent directory does not exist either" >&2
            fi
            exit 1
          fi

          bash "$script"
          REMOTE

  deploy-vm2:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH for VM2
        env:
          VM2_SSH_KEY: ${{ secrets.VM2_SSH_KEY }}
          VM2_KNOWN_HOSTS: ${{ secrets.VM2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VM2_SSH_KEY" > ~/.ssh/vm2_deploy_key
          chmod 600 ~/.ssh/vm2_deploy_key

          printf '%s\n' "$VM2_KNOWN_HOSTS" > ~/.ssh/vm2_known_hosts
          chmod 600 ~/.ssh/vm2_known_hosts

      - name: Deploy to VM2
        env:
          VM2_HOST: ${{ secrets.VM2_HOST }}
          VM2_USER: ${{ secrets.VM2_USER }}
          VM2_BUILD_SCRIPT: ${{ secrets.VM2_BUILD_SCRIPT }}
        run: |
          raw_path="$(printf '%s' "$VM2_BUILD_SCRIPT" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          quoted_path="$(printf '%q' "$raw_path")"

          ssh -i ~/.ssh/vm2_deploy_key \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/vm2_known_hosts \
            "$VM2_USER@$VM2_HOST" \
            "bash -s -- $quoted_path" <<'REMOTE'
          set -euo pipefail

          script="$1"
          case "$script" in
            "~/"*) script="$HOME/${script#\~/}" ;;
          esac

          if [ ! -f "$script" ]; then
            echo "Build script not found on VM2." >&2
            echo "  remote user : $(whoami)" >&2
            echo "  remote home : $HOME" >&2
            echo "  script name : $(basename -- "$script")" >&2
            dir="$(dirname -- "$script")"
            if [ -d "$dir" ]; then
              echo "  parent directory exists, contents:" >&2
              ls -la -- "$dir" >&2
            else
              echo "  parent directory does not exist either" >&2
            fi
            exit 1
          fi

          bash "$script"
          REMOTE
